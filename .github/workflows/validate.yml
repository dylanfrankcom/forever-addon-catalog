name: validate

# Pull requests only: every change reaches main through one, so main isn't checked again.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Self-test
        run: dotnet run scripts/validate.cs -- --self-test
      - name: Self-test find-sources
        run: dotnet run scripts/find-sources.cs -- --self-test
      - name: Self-test discover
        run: dotnet run scripts/discover.cs -- --self-test
      - name: Self-test check
        run: dotnet run scripts/check.cs -- --self-test
      - name: Self-test generate
        run: dotnet run scripts/generate.cs -- --self-test
      - name: Self-test details
        run: dotnet run scripts/details.cs -- --self-test
      - name: Self-test reports
        run: dotnet run scripts/reports.cs -- --self-test
      - name: Self-test tags
        run: dotnet run scripts/tags.cs -- --self-test
      - name: Validate catalog.json
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The catalog on the branch this PR merges into; empty when it has none yet.
            git show "origin/$BASE_REF:catalog.json" > "$RUNNER_TEMP/base.json" 2>/dev/null || : > "$RUNNER_TEMP/base.json"
            dotnet run scripts/validate.cs -- catalog.json --base "$RUNNER_TEMP/base.json"
          else
            dotnet run scripts/validate.cs -- catalog.json
          fi
