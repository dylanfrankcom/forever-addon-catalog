name: check

# Checks the latest release of each add-on discovery found (scripts/check.cs) and keeps the result, checks.json, on the
# `checker` branch beside candidates.json. It never touches main and lists nothing by itself.
# Every 6 hours, so a release held back for its first 6 hours is checked soon after, or by hand
# (Actions -> check -> Run workflow).

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Edition ID whose add-ons are checked, or all"
        type: string
        default: forever

permissions:
  contents: write

concurrency:
  group: checker-data
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    name: Check releases
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out the checker branch
        id: data
        run: |
          if git fetch --no-tags --depth=1 origin checker:refs/remotes/origin/checker; then
            git worktree add -B checker data origin/checker
          fi
          if [ -f data/candidates.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No candidates.json yet: the discover workflow writes it first." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.data.outputs.ready == 'true'
        with:
          global-json-file: global.json
      - name: Check releases
        if: steps.data.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope || 'forever' }}
        run: dotnet run scripts/check.cs -- --candidates data/candidates.json --out data/checks.json --scope "$SCOPE" --summary "$GITHUB_STEP_SUMMARY"
      - name: Save checks.json
        if: steps.data.outputs.ready == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks.json
          if git diff --cached --quiet -I '^  "checked": '; then
            echo "No changes (only the run time)."
          else
            git commit -q -m "Checks $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin checker
          fi
