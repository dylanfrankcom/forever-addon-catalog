name: check

# Checks the latest release of each add-on discovery found (scripts/check.cs) and keeps the result, checks.json, on the
# `checker` branch beside candidates.json. Then it generates catalog.json, versions.json and icons/ (scripts/generate.cs),
# validates them, and commits them to main only when they changed and passed: a failed or broken run changes nothing, so
# the last good files stay published. (main must accept pushes from this workflow.)
# Every hour, so a release held back for its first 6 hours is checked soon after, or by hand
# (Actions -> check -> Run workflow). It has its own concurrency group, so a long discovery run never holds it up: the
# workflows write different files on `checker`, and a refused push is rebased and tried again (.github/push-checker.sh).
#
# It fails loudly rather than passing without building: when there's no discovery data yet, and when the catalog is
# stale, meaning a generator input (scripts, overrides/, optout.json, confirmed.json, tags.json, schema/) changed on main
# more than 3 hours after the last successful build (.github/catalog-current.sh; each build records the main commit it
# was made from in built.json on `checker`).

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Edition ID whose add-ons are checked, or all"
        type: string
        default: forever

permissions:
  contents: write

concurrency:
  group: release-check
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    name: Check releases
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, without file contents, so the last step can tell which inputs changed since the last build.
          fetch-depth: 0
          filter: blob:none
      - name: Check out the checker branch
        id: data
        run: |
          if git fetch --no-tags --depth=1 origin checker:refs/remotes/origin/checker; then
            git worktree add -B checker data origin/checker
          fi
          if [ -f data/candidates.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No candidates.json on the checker branch yet: the discover workflow writes it first. Nothing was built." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.data.outputs.ready == 'true'
        with:
          global-json-file: global.json
      - name: Check releases
        if: steps.data.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope || 'forever' }}
        run: dotnet run scripts/check.cs -- --candidates data/candidates.json --out data/checks.json --scope "$SCOPE" --summary "$GITHUB_STEP_SUMMARY"
      - name: Save checks.json
        if: steps.data.outputs.ready == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks.json
          if git diff --cached --quiet -I '^  "checked": '; then
            echo "No changes (only the run time)."
          else
            git commit -q -m "Checks $(date -u +%Y-%m-%dT%H:%MZ)"
            bash ../.github/push-checker.sh
          fi
      - name: Generate the catalog, versions.json and detail files
        if: steps.data.outputs.ready == 'true'
        run: |
          dotnet run scripts/generate.cs -- --candidates data/candidates.json --checks data/checks.json --summary "$GITHUB_STEP_SUMMARY"
          dotnet run scripts/details.cs -- --candidates data/candidates.json
          dotnet run scripts/validate.cs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish them
        if: steps.data.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json versions.json icons addons
          if git diff --cached --quiet; then
            echo "The catalog and versions.json are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Catalog $(jq -r .version catalog.json), versions $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi
      - name: Record the build
        if: steps.data.outputs.ready == 'true'
        working-directory: data
        env:
          BUILT: ${{ github.sha }}
        run: |
          echo "{ \"commit\": \"$BUILT\" }" > built.json
          git add built.json
          # Only when main moved since the last build: an unchanged build adds no commit.
          if ! git diff --cached --quiet; then
            git commit -q -m "Built from $BUILT"
            bash ../.github/push-checker.sh
          fi
      - name: Is the catalog current?
        if: always()
        run: bash .github/catalog-current.sh data/built.json | tee -a "$GITHUB_STEP_SUMMARY"
