name: linkcheck

# Checks that each add-on's site links in catalog.json still lead somewhere (scripts/linkcheck.cs) and keeps the result,
# linkchecks.json, on the `checker` branch, where the catalog build reads it. Weekly, or by hand (Actions -> linkcheck ->
# Run workflow): links rarely break, and the requests go to other people's sites. CurseForge is never requested; Wago,
# WoWInterface's API and homepages get one request per link, a second apart.
#
# It has its own concurrency group, so it never waits for a long discover run. The workflows write different files on
# `checker`, so a refused push is rebased and tried again (.github/push-checker.sh).

on:
  schedule:
    - cron: "47 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkcheck
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  linkcheck:
    name: Check the site links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check out the checker branch
        run: |
          if git fetch --no-tags --depth=1 origin checker:refs/remotes/origin/checker; then
            git worktree add -B checker data origin/checker
          else
            git worktree add --orphan -b checker data
          fi
      - name: Check the site links
        run: dotnet run scripts/linkcheck.cs -- --out data/linkchecks.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Save linkchecks.json
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkchecks.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Link checks $(date -u +%Y-%m-%d)"
            bash ../.github/push-checker.sh
          fi
