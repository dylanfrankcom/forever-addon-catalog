name: discover

# Finds add-ons for every edition on public GitHub repos (scripts/discover.cs) and keeps the result, candidates.json, on
# the `checker` branch, where the release check reads it. It never touches main and lists nothing by itself.
# In parts, each on its own schedule (scripts/discover.cs, --part):
# - search, every 4 hours: code search for new repos (up to an hour; the Interface searched longest ago first, and an
#   unfinished one goes first next time), then reads the new repos and re-reads only the known ones that changed.
# - stats, daily: every repo's download counts (with a 30-day history of daily totals) and its funding links' answers.
# Both write candidates.json, so they share the checker-data group and never overlap. By hand (Actions -> discover ->
# Run workflow): a part, "all" (everything, every repo read again) or "reread" (every repo read again, no search).

on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: "search, stats, all, or reread (all without the search)"
        type: choice
        options: [search, stats, all, reread]
        default: search

permissions:
  contents: write

concurrency:
  group: checker-data
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  discover:
    name: Find add-ons on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Check out the checker branch
        run: |
          if git fetch --no-tags --depth=1 origin checker:refs/remotes/origin/checker; then
            git worktree add -B checker data origin/checker
          else
            git worktree add --orphan -b checker data
          fi
      - name: Find add-ons
        timeout-minutes: 300
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A scheduled run's part comes from the line that started it.
          PART: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 6 * * *' && 'stats' || 'search') || inputs.part }}
        run: |
          set -- --out data/candidates.json --summary "$GITHUB_STEP_SUMMARY" --search-minutes 60
          case "$PART" in
            search|stats) set -- "$@" --part "$PART" ;;
            reread) set -- "$@" --no-search ;;
            all) ;;
            *) echo "Unknown part: $PART"; exit 1 ;;
          esac
          dotnet run scripts/discover.cs -- "$@"
      - name: Save candidates.json
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Candidates $(date -u +%Y-%m-%d)"
            bash ../.github/push-checker.sh
          fi
