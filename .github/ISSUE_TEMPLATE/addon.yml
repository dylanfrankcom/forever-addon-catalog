name: Add an add-on
description: Suggest an add-on for the catalog.
labels: ["catalog-entry", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Only add-ons whose current release lists WoW Forever's Interface in its `.toc` can be listed. Every detail below is checked before an entry is added, so fill in what you know and leave the rest blank.
  - type: input
    id: name
    attributes:
      label: Add-on
      description: Its name, and its main author if you know it (one name, not every contributor).
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Where it's published
      description: Every page you know of. GitHub (with releases), CurseForge and Wago.
      placeholder: |
        GitHub: https://github.com/...
        CurseForge: https://www.curseforge.com/wow/addons/...
        Wago: https://addons.wago.io/addons/...
    validations:
      required: true
  - type: textarea
    id: forever
    attributes:
      label: Works on Forever?
      description: Which release lists the Forever Interface in its `.toc` (the file name and its `## Interface:` line), and anything you know about how it runs.
  - type: input
    id: folders
    attributes:
      label: Folders
      description: The folders it installs into AddOns, if you know them.
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: What it's for, from the catalog's tags. If it does several things, say in Notes which is its main one.
      multiple: true
      options:
        - "auction-house: buying, selling and pricing at the auction house"
        - "bags: bags, the bank and items across characters"
        - "chat: chat windows, whispers and messages"
        - "class: your class's spells and abilities, trainers and talents"
        - "combat: damage and threat meters, cooldowns, combat text"
        - "dungeons: dungeons and raids, their bosses, abilities and groups"
        - "loot: loot tables, drops and rolling for loot"
        - "map: the world map and the minimap"
        - "professions: professions and gathering, recipes, skill-ups, nodes"
        - "quests: quests, objectives and quest givers"
        - "ui: moving, hiding and arranging the game's windows, bars and buttons"
  - type: input
    id: license
    attributes:
      label: Licence
      description: As its author states it (for example MIT or GPL-3.0). Leave blank if none is stated.
  - type: input
    id: issues
    attributes:
      label: Where to report problems
      description: The author's issue tracker, if there is one.
  - type: textarea
    id: sponsor
    attributes:
      label: Support the author
      description: Every page where the author asks for support (GitHub Sponsors, Ko-fi, Patreon, Buy Me a Coffee, PayPal …), one per line, if they list any.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Required add-ons, optional ones, conflicts, anything else.
